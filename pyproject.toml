[project]
name = "gamerag"
version = "0.1.0"
description = "Asistente RAG para juegos retro de NES con protección de spoilers (CC3103, UVG)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
# Núcleo liviano: lo necesario para la línea base (fase 2): ingesta, BM25, API, LLM.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.40",
    "mwparserfromhell>=0.6",
    "langgraph>=1.2.20",
]

[project.optional-dependencies]
# Fase 3: recuperación semántica + reranking. Pesado (torch), por eso es opcional.
semantic = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "torch>=2.3",
]
ui = [
    "httpx>=0.27",
    "streamlit>=1.36",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamerag"]

# torch solo-CPU: evita descargar ~2 GB de CUDA en la imagen Docker y en laptops sin GPU.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
