# Fuentes de corpus por juego (las usa scripts/fetch_corpus.py). Solo texto de wikis con licencia abierta.
# Licencias tomadas de la API de cada sitio (meta=siteinfo&siprop=rightsinfo) el 2026-11-08. Nunca se incluyen
# manuales ni guías con derechos reservados (GameFAQs, manuales de Nintendo).
sites:
  strategywiki:
    api: https://strategywiki.org/w/api.php
    url_base: https://strategywiki.org/wiki/
    license: CC BY-SA 4.0
  wikipedia:
    api: https://en.wikipedia.org/w/api.php
    url_base: https://en.wikipedia.org/wiki/
    license: CC BY-SA 4.0
  grandtheftwiki:
    api: https://www.grandtheftwiki.com/api.php
    url_base: https://www.grandtheftwiki.com/
    license: CC BY-SA 3.0
  gta_fandom:
    api: https://gta.fandom.com/api.php
    url_base: https://gta.fandom.com/wiki/
    license: CC BY-SA
    license_note: Fandom reporta "CC-BY-SA" sin versión (normalmente 3.0).
  reddead_fandom:
    api: https://reddead.fandom.com/api.php
    url_base: https://reddead.fandom.com/wiki/
    license: CC BY-SA
    license_note: Fandom reporta "CC-BY-SA" sin versión (normalmente 3.0).
  ac_fandom:
    api: https://assassinscreed.fandom.com/api.php
    url_base: https://assassinscreed.fandom.com/wiki/
    license: CC BY-SA
    license_note: Fandom reporta "CC-BY-SA" sin versión (normalmente 3.0).
  doom_fandom:
    api: https://doom.fandom.com/api.php
    url_base: https://doom.fandom.com/wiki/
    license: CC BY-SA
    license_note: Fandom reporta "CC-BY-SA" sin versión (normalmente 3.0).
  ninjagaiden_fandom:
    api: https://ninjagaiden.fandom.com/api.php
    url_base: https://ninjagaiden.fandom.com/wiki/
    license: CC BY-SA
    license_note: Fandom reporta "CC-BY-SA" sin versión (normalmente 3.0).
  zeldapedia:
    api: https://zelda.fandom.com/api.php
    url_base: https://zelda.fandom.com/wiki/
    license: GFDL
    license_note: GNU Free Documentation License. Copyleft distinto de CC BY-SA; mantener separada y atribuida.
  zeldawiki:
    api: https://zeldawiki.wiki/w/api.php
    url_base: https://zeldawiki.wiki/wiki/
    license: GFDL 1.3
    license_note: GNU Free Documentation License 1.3. Copyleft distinto de CC BY-SA; mantener separada y atribuida.

