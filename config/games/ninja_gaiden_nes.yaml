# Configuración del juego: lo único que cambia entre juegos. El pipeline es el mismo.
game_id: ninja_gaiden_nes
title: Ninja Gaiden
platform: NES
year: 1988
aliases: [Shadow Warriors, Ninja Ryukenden]

snapshot_dir: data/wiki_snapshot/strategywiki/ninja_gaiden_nes

# Otras wikis (scripts/fetch_corpus.py). Lo que no trae ubicación queda restringido hasta etiquetarlo.
extra_sources:
  - {site: wikipedia, snapshot_dir: data/wiki_snapshot/wikipedia/ninja_gaiden_nes, general_headings: 'Gameplay|Development|Release|Reception|Legacy|Sales'}
  - {site: ninjagaiden_fandom, snapshot_dir: data/wiki_snapshot/ninjagaiden_fandom/ninja_gaiden_nes}
manual:
  url: https://www.nintendo.co.jp/clv/manuals/en/pdf/CLV-P-NACBE.pdf
  local_path: data/raw/manuals/CLV-P-NACBE.pdf   # gitignored (© Nintendo)

# Modelo de progreso: etapa actual, orden total (no se pueden saltar etapas).
progress_model: linear_stage
# Tomado de los encabezados del snapshot. Ojo: la wiki dice "20 levels", pero sus encabezados
# dan 21 identificadores; el último aparece como "Act 6-5" (pelea contra el Demon), no "Stage 6-5".
# Seguimos el corpus para que cada chunk mapee a una etapa existente.
# El jefe de cada acto está dentro de la última etapa (p. ej. Barbarian en 1-2).
stages: ["1-1", "1-2",
         "2-1", "2-2", "2-3",
         "3-1", "3-2", "3-3",
         "4-1", "4-2", "4-3", "4-4",
         "5-1", "5-2", "5-3", "5-4",
         "6-1", "6-2", "6-3", "6-4", "6-5"]

location_from_title: 'Act (?P<act>\d)'
location_from_heading: '(?:Stage|Act) (?P<stage>\d-\d)'

# Índice de navegación: solo enlaces, sin contenido del juego.
exclude_pages: ["Ninja Gaiden (NES)/Table of Contents"]

# La etapa actual permite combatir a su jefe; su desenlace se abre al avanzar.
# Structural/rows preservan límites de párrafo. Fixed se trata conservadoramente
# cuando un corte impide comprobar el límite del pasaje.
content_rules:
  - {source: '/Act 1$', section: 'Stage 1-2', match: '^Defeat Barbarian', after_stage: '1-2'}
  - {source: '/Act 2$', section: 'Stage 2-3', match: '^After defeating Bomberhead', after_stage: '2-3'}
  - {source: '/Act 3$', section: 'Stage 3-3', match: "^As soon as the battle's over", after_stage: '3-3'}
  - {source: '/Act 4$', section: 'Stage 4-4', match: '^Upon defeating Kelbeross', after_stage: '4-4'}
  - {source: '/Act 5$', section: 'Stage 5-4', match: '^Whichever technique you rely on', after_stage: '5-4'}
  - {source: '/Act 6$', section: 'Stage 6-4', match: '^After the orb is defeated|^If you defeat the Jaquio', after_stage: '6-4'}
  - {source: '/Act 6$', section: 'Act 6-5', match: 'end of the story|staff credits|Congratulations', unit: sentence, after_stage: '6-5'}

tools: [search_documents, query_game_facts, update_progress]

# Glosario: vocabulario del jugador -> vocabulario de la wiki (docs/retrieval/query-expansion.md).
# Criterio (igual que zelda1): equivalencias generales tomadas de las páginas Gameplay (Controls,
# Player, Status bar) e Items; NO frases de casos de prueba. Escrito después del mini banco de NG.
query_expansion:
  rewrites: []
  synonyms:
    # Acciones (Gameplay > Controls): "attack" aparece en 27 de 84 chunks (enemigos que atacan), así
    # que por sí sola no distingue los controles.
    attack: [B button, swinging your sword]
    hit: [B button, swinging your sword]
    fight: [B button, swinging your sword]
    jump: [A button]
    pause: [Start button]
    # Recursos (Gameplay > Player, Items): nombres propios del juego.
    ninpo: [spirit points]
    magic: [spirit points]
    mana: [spirit points]
    special: [secondary weapon]
    subweapon: [secondary weapon]
    shuriken: [throwing star]
    sword: [katana]
    heal: [restore health, potion]
