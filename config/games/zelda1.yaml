# Configuración del juego: lo único que cambia entre juegos. El pipeline es el mismo.
game_id: zelda1
title: The Legend of Zelda
platform: NES
year: 1986
aliases: []

snapshot_dir: data/wiki_snapshot/strategywiki/zelda1
manual:
  url: https://www.nintendo.co.jp/clv/manuals/en/pdf/CLV-P-NAANE.pdf
  local_path: data/raw/manuals/CLV-P-NAANE.pdf   # gitignored (© Nintendo)

# Modelo de progreso: conjunto de mazmorras completadas + quest (no lineal).
progress_model: level_set
levels: [1, 2, 3, 4, 5, 6, 7, 8, 9]
quests: [first, second]

# Cómo derivar la ubicación (metadatos de acceso) desde el título de la página de la wiki.
location_from_title: 'Underworld/Quest (?P<quest>\d)/Dungeon (?P<level>\d)'
location_from_heading: null

# Índice de navegación: solo enlaces, sin contenido del juego.
exclude_pages: ["The Legend of Zelda/Table of Contents"]

tools: [search_documents, query_game_facts, next_available_levels, update_progress]

# Glosario: vocabulario del jugador -> vocabulario de la wiki (docs/retrieval/query-expansion.md).
# Criterio: equivalencias generales de terminología del juego, tomadas de las páginas Controls, Items
# y de los títulos de la wiki. NO frases de casos de prueba concretos.
query_expansion:
  # Reglas de identificadores ("Level-3" -> "dungeon 3", "first quest" -> "quest 1"): DESCARTADAS.
  # En la ablación bajaron el Recall@5 del curso de 0.89 a 0.78 sin mejorar nada más: agregar
  # "dungeon N quest 1" favorece a todos los recorridos de mazmorras (todos tienen Quest/Dungeon en el
  # título). Ver docs/evaluation/results.md, "Transformación de consultas".
  rewrites: []
  synonyms:
    # Acciones (Controls): la wiki describe acciones, no verbos genéricos.
    attack: [swing the sword, A button]
    hit: [swing the sword]
    fight: [swing the sword]
    menu: [sub-screen]
    inventory: [sub-screen]
    secondary: [subweapon, B button]
    # Recursos (Items): nombres propios del juego.
    money: [rupees]
    cash: [rupees]
    coins: [rupees]
    heal: [refills hearts, life meter]
    health: [hearts, life meter]
    hearts: [heart container]
    weapon: [sword]
    door: [key]

