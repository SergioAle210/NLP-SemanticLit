name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si llega un push nuevo a la misma rama, cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint y tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked: falla si uv.lock no coincide con pyproject.toml
      # (detecta cuando alguien agrega una dependencia y olvida commitear el lock).
      # Solo instala el núcleo + dev: los extras pesados (torch) no son necesarios para estos tests.
      - name: Instalar dependencias
        run: uv sync --locked

      - name: Ruff (linter)
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -v
